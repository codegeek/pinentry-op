name: Feature request
description: Suggest a new capability or a change in behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like pinentry-op to behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have tried.
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: pinentry-op handles passphrases. Could this change expose secrets, approve prompts without the user, or weaken a failure mode?
