# Cargo dependencies only. GitHub Actions in release.yml are generated by dist
# (update them with `dist init`), and ci.yml's actions are updated by hand.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Also assigned by the assign workflow; this covers PRs if that cannot run.
    assignees: [codegeek]
    groups:
      cargo:
        update-types: [minor, patch]
