[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
# Unix only: non-Unix targets do not compile. Linux uses glibc builds, which the
# generated Homebrew formula expects for Homebrew on Linux.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# A GitHub repo to push Homebrew formulas to
tap = "codegeek/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Extra files to ship in each archive; the Homebrew formula installs them into pkgshare
include = ["config.example.toml"]
# Sign build provenance for each release archive (verify with gh attestation verify)
github-attestations = true
