[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
# macOS only: the README documents macOS with pinentry-mac, and non-Unix targets do not compile.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Where to host releases
hosting = "github"
# A GitHub repo to push Homebrew formulas to
tap = "codegeek/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Extra files to ship in each archive; the Homebrew formula installs them into pkgshare
include = ["config.example.toml"]
