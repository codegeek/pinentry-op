# Replace executable paths with the output of:
# command -v op
# command -v pinentry-mac
op_program = "/opt/homebrew/bin/op"
fallback_program = "/opt/homebrew/bin/pinentry-mac"
timeout_seconds = 120
# account = "YOUR_ACCOUNT_ID"

# When op fails or times out, including when the 1Password app is not running:
# "cancel" (default) cancels the request; "prompt" opens the fallback pinentry,
# which also happens after you cancel the 1Password prompt.
# on_lookup_failure = "cancel"

# gpg --with-keygrip --list-secret-keys
# Add the keygrip (not the OpenPGP fingerprint or ID) of every key you use:
# the encryption subkey [E] for decryption, and the signing subkey [S] or, if
# there is none, the primary key [SC] for signing. Keys sharing a passphrase
# can share a reference.
# Prefer vault/item IDs in references so renaming entries does not break lookup.
[keys]
# Primary key [SC]
"0123456789ABCDEF0123456789ABCDEF01234567" = "op://VAULT_ID/ITEM_ID/password"
# Encryption subkey [E]
"89ABCDEF0123456789ABCDEF0123456789ABCDEF" = "op://VAULT_ID/ITEM_ID/password"
